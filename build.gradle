plugins {
    id 'java'
    id 'checkstyle'
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Sibling 420 kc plugins on the test classpath -- enables a combined runelite
    // launch where the clan-clog dev build runs alongside the latest kill clog code.
    if (file('../kcpdev/build/libs/kill-clog-plugin-1.3.2.jar').exists()) {
        testImplementation files('../kcpdev/build/libs/kill-clog-plugin-1.3.2.jar')
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

group = 'com.clanclog'
version = '0.1.0'
sourceCompatibility = '11'
targetCompatibility = '11'

checkstyle {
    toolVersion = '8.25'
    configDirectory = file("config/checkstyle")
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']
}

task run(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.clanclog.ClanClogPluginTest'
    jvmArgs = ['-ea']
}
